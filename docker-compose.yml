# Local Postgres for development. Start with:  docker compose up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: storyteller
      POSTGRES_PASSWORD: storyteller
      POSTGRES_DB: storyteller
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storyteller"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
